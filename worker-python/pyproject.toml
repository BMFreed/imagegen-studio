[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "imagegen-worker"
version = "0.1.0"
description = "ImageGen Studio's isolated Python image worker"
requires-python = ">=3.12,<3.13"
dependencies = ["pillow==12.2.0"]

[project.scripts]
imagegen-worker = "imagegen_worker.__main__:main"

[dependency-groups]
dev = ["basedpyright==1.40.1", "pytest==8.4.2", "ruff==0.16.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/imagegen_worker"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
reportMissingTypeStubs = false
