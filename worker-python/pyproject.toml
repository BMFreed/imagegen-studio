[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "imagegen-worker"
version = "0.1.0"
description = "ImageGen Studio's isolated Python image worker"
requires-python = ">=3.12,<3.13"
dependencies = ["pillow==12.2.0"]

[project.optional-dependencies]
inference = [
  "accelerate==1.14.0",
  "compel==2.4.0",
  "diffusers==0.40.0",
  "opencv-python-headless==5.0.0.93",
  "peft==0.21.2",
  "safetensors==0.8.0",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "torchsde==0.2.6",
  "transformers==5.5.4",
]

[project.scripts]
imagegen-worker = "imagegen_worker.__main__:main"

[dependency-groups]
dev = ["basedpyright==1.40.1", "pytest==8.4.2", "ruff==0.16.9"]

[tool.uv]
# Compel declares a notebook runtime but does not use it for prompt conditioning.
exclude-dependencies = ["notebook"]

[tool.hatch.build.targets.wheel]
packages = ["src/imagegen_worker"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Preserve the byte-exact third-party solver; application wrappers remain checked.
extend-exclude = ["src/imagegen_worker/vendor/er_sde_scheduler.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
typeCheckingMode = "strict"
extraPaths = ["../scripts"]
include = ["src", "tests"]
exclude = ["src/imagegen_worker/vendor/er_sde_scheduler.py"]
reportMissingTypeStubs = false
